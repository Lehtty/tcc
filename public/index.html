<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODEXA – Moda que move você</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="../src/assets/styles/style_one.css">
    <link rel="stylesheet" href="../src/assets/styles/carousel.css">
    
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../src/assets/icons/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MODEXA">
    <link rel="apple-touch-icon" href="../src/assets/icons/icon-192.png">
</head>
<body style="opacity: 0; transition: opacity 0.15s ease;">
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo" id="shop-logo">MODE<span>XA</span></a>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="products.html">Produtos</a>
                <a href="products.html?category=Feminino">Feminino</a>
                <a href="products.html?category=Masculino">Masculino</a>
            </div>
            <div class="nav-actions">
                <button class="search-btn" onclick="showToast('Busca indisponível')"><span class="icon-txt">🔍</span></button>
                <button class="cart-btn" onclick="openCart()" style="position:relative">
                    <span class="icon-txt">🛍️</span><span class="cart-badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-inner">
            <div class="hero-text">
                <div class="hero-tag">✦ Nova Coleção 2027</div>
                <h1>Vista o que<br>você <em>sente</em></h1>
                <p class="hero-sub">Peças exclusivas com qualidade premium. O disfarce perfeito para o seu dia a dia.</p>
                <div class="hero-ctas">
                    <button class="btn-primary" onclick="scrollToProducts()">Explorar</button>
                </div>
            </div>
            <div class="hero-visual">
                <div class="hero-card carousel">
                    <div class="carousel-track" id="carousel-track">
                        <div class="carousel-slide active">
                            <img src="../src/assets/images/carousel/carousel_1.png" alt="Coleção Primavera/Verão MODEXA">
                        </div>
                        <div class="carousel-slide">
                            <img src="../src/assets/images/carousel/carousel_2.png" alt="Estilo e Elegância MODEXA">
                        </div>
                        <div class="carousel-slide">
                            <img src="../src/assets/images/carousel/carousel_3.png" alt="Conforto e Alta Costura MODEXA">
                        </div>
                        <div class="carousel-slide">
                            <img src="../src/assets/images/carousel/carousel_4.png" alt="Tendências Modernas MODEXA">
                        </div>
                    </div>
                    <button class="carousel-control prev" aria-label="Anterior">&lsaquo;</button>
                    <button class="carousel-control next" aria-label="Próximo">&rsaquo;</button>
                    <div class="carousel-indicators">
                        <span class="indicator active" data-index="0"></span>
                        <span class="indicator" data-index="1"></span>
                        <span class="indicator" data-index="2"></span>
                        <span class="indicator" data-index="3"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="section" id="products">
        <div class="section-header">
            <h2 class="section-title">Destaques da <span>Semana</span></h2>
        </div>
        <div class="products-grid" id="products-grid"></div>
    </section>

    <div class="cart-overlay" id="cart-overlay" onclick="closeCartOutside(event)">
        <div class="cart-sidebar">
            <div class="cart-header">
                <h3 style="display: flex; align-items: center; gap: 10px;">Meu Carrinho <a href="index.html" class="logo" style="font-size: 1.15rem; text-decoration: none;">MODE<span>XA</span></a></h3>
                <button onclick="closeCart()">✕</button>
            </div>
            <div class="cart-items" id="cart-items"></div>
            <div class="cart-footer">
                <div class="cart-total">Total: <span id="cart-total">R$ 0,00</span></div>
                <button class="btn-primary" style="width:100%" onclick="checkoutCart()">Finalizar</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="../src/js/products.js"></script>
    <script src="../src/js/cart.js"></script>
    <script src="../src/js/security.js"></script>
    <script src="../src/js/steganography.js"></script>
    <script src="../src/js/main.js"></script>
</body>
</html>
