<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto – MODEXA</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="../src/assets/styles/style_one.css">
    
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../src/assets/icons/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MODEXA">
    <link rel="apple-touch-icon" href="../src/assets/icons/icon-192.png">
    <style>
        .detail-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 2rem;
        }
        .breadcrumb {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray);
            margin-bottom: 15px;
        }
        .breadcrumb a {
            color: var(--gray);
            text-decoration: none;
            transition: color 0.2s;
        }
        .breadcrumb a:hover {
            color: var(--rose);
        }
        .product-detail-layout {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr;
            gap: 35px;
            align-items: start;
        }
        .product-gallery {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .thumbnail-strip {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80px;
            flex-shrink: 0;
        }
        .thumbnail-item {
            width: 80px;
            height: 100px;
            border-radius: var(--radius);
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .thumbnail-item:hover {
            opacity: 0.9;
        }
        .thumbnail-item.active {
            opacity: 1;
            border-color: var(--rose);
            transform: scale(1.02);
        }
        .main-image-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: var(--radius);
        }
        .main-image-container img {
            width: 100%;
            max-height: 480px;
            border-radius: var(--radius);
            aspect-ratio: var(--img-ratio);
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: opacity 0.3s ease, transform 0.5s ease;
        }
        @media (max-width: 768px) {
            .detail-container {
                padding: 0 1rem;
            }
            .product-detail-layout {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 15px !important;
            }
            .product-gallery {
                flex-direction: column-reverse;
                gap: 15px;
            }
            .thumbnail-strip {
                flex-direction: row;
                width: 100%;
                overflow-x: auto;
                padding-bottom: 5px;
                gap: 10px;
                scrollbar-width: thin;
            }
            .thumbnail-item {
                width: 60px;
                height: 80px;
                flex-shrink: 0;
            }
        }
        .product-info-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-brand {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--rose);
            font-weight: 600;
        }
        .product-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 2.5vw, 2.2rem);
            font-weight: 700;
            line-height: 1.2;
        }
        .product-price-row {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }
        .product-price-current {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--rose);
        }
        .product-price-old {
            font-size: 1.1rem;
            text-decoration: line-through;
            color: var(--gray);
        }
        .option-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--border, #eee);
            padding-top: 12px;
        }
        .option-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--black);
        }
        .color-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            outline: 1px solid var(--border, #ddd);
            transition: transform 0.2s, outline-color 0.2s;
        }
        .color-option:hover {
            transform: scale(1.1);
        }
        .color-option.selected {
            border-color: var(--white, #fff);
            outline: 2.5px solid var(--rose);
            transform: scale(1.1);
        }
        .size-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .size-option {
            background: var(--cream);
            color: var(--black);
            border: 1px solid var(--border, #ddd);
            padding: 10px 18px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .size-option:hover {
            border-color: var(--black);
        }
        .size-option.selected {
            background: var(--black);
            color: var(--white, #fff);
            border-color: var(--black);
        }
        .purchase-controls {
            display: flex;
            gap: 20px;
            margin-top: 5px;
            border-top: 1px solid var(--border, #eee);
            padding-top: 15px;
        }
        .quantity-selector {
            display: flex;
            align-items: center;
            border: 1px solid var(--border, #ddd);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--cream);
        }
        .quantity-btn {
            background: none;
            border: none;
            width: 45px;
            height: 45px;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--black);
            transition: background 0.2s;
        }
        .quantity-btn:hover {
            background: rgba(0,0,0,0.05);
        }
        .quantity-value {
            width: 45px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--black);
        }
        .product-description {
            margin-top: 5px;
            line-height: 1.6;
            font-size: 0.92rem;
            color: var(--gray);
        }
        .btn-purchase {
            flex: 1;
        }
        .badge-tag-detail {
            align-self: flex-start;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 4px 10px;
            letter-spacing: 1px;
            color: #fff;
            border-radius: var(--radius);
        }
        .badge-tag-detail.sale { background: var(--rose); }
        .badge-tag-detail.new { background: #aaf0cb; color: #111; }
        .badge-tag-detail.hot { background: #ff2b2b; }
    </style>
</head>
<body style="opacity: 0; transition: opacity 0.15s ease;">
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo" id="shop-logo">MODE<span>XA</span></a>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="products.html">Produtos</a>
                <a href="products.html?category=Feminino">Feminino</a>
                <a href="products.html?category=Masculino">Masculino</a>
            </div>
            <div class="nav-actions">
                <button class="search-btn" onclick="showToast('Busca indisponível')"><span class="icon-txt">🔍</span></button>
                <button class="cart-btn" onclick="openCart()" style="position:relative">
                    <span class="icon-txt">🛍️</span><span class="cart-badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="detail-container" id="product-detail-view">
        <p style="text-align:center; padding:100px; color:var(--gray);">Carregando informações do produto...</p>
    </div>

    <div class="cart-overlay" id="cart-overlay" onclick="closeCartOutside(event)">
        <div class="cart-sidebar">
            <div class="cart-header">
                <h3 style="display: flex; align-items: center; gap: 10px;">Meu Carrinho <a href="index.html" class="logo" style="font-size: 1.15rem; text-decoration: none;">MODE<span>XA</span></a></h3>
                <button onclick="closeCart()">✕</button>
            </div>
            <div class="cart-items" id="cart-items"></div>
            <div class="cart-footer">
                <div class="cart-total">Total: <span id="cart-total">R$ 0,00</span></div>
                <button class="btn-primary" style="width:100%" onclick="checkoutCart()">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../src/js/products.js"></script>
    <script src="../src/js/cart.js"></script>
    <script src="../src/js/security.js"></script>
    <script src="../src/js/steganography.js"></script>
    <script src="../src/js/main.js"></script>
    
    <script>
        let selectedColor = '';
        let selectedSize = '';
        let quantity = 1;
        let product = null;

        function loadProductDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            
            const container = document.getElementById('product-detail-view');
            if (!container) return;

            if (isNaN(id) || typeof products === 'undefined') {
                showError("Identificador de produto inválido.");
                return;
            }

            product = products.find(p => p.id === id);
            window.product = product;
            if (!product) {
                showError("Produto não encontrado em nosso catálogo.");
                return;
            }

            if (product.colors && product.colors.length > 0) selectedColor = product.colors[0];
            if (product.sizes && product.sizes.length > 0) selectedSize = product.sizes[0];

            renderDetail(container);

            if (typeof window.updateAppState === 'function') {
                window.updateAppState(selectedColor, selectedSize, quantity);
            }
        }

        function showError(msg) {
            const container = document.getElementById('product-detail-view');
            container.innerHTML = `
                <div style="text-align:center; padding:80px 20px;">
                    <h3 style="font-family:var(--font-display); font-size:2rem; margin-bottom:20px; color:var(--black);">Ops!</h3>
                    <p style="color:var(--gray); margin-bottom:30px;">${msg}</p>
                    <a href="products.html" class="btn-primary" style="text-decoration:none; display:inline-block;">Voltar ao Catálogo</a>
                </div>
            `;
        }

        function renderDetail(container) {
            document.title = `${product.name} – MODEXA`;

            const images = product.imgs && product.imgs.length > 0 ? product.imgs : [product.img];

            container.innerHTML = `
                <div class="breadcrumb">
                    <a href="index.html">Início</a> / 
                    <a href="products.html">Produtos</a> / 
                    <a href="products.html?category=${encodeURIComponent(product.category)}">${product.category}</a> / 
                    <span>${product.name}</span>
                </div>
                
                <div class="product-detail-layout">
                    <div class="product-gallery">
                        ${images.length > 1 ? `
                            <div class="thumbnail-strip">
                                ${images.map((imgUrl, idx) => `
                                    <img src="${imgUrl}" 
                                         alt="Miniatura ${idx + 1}" 
                                         class="thumbnail-item ${idx === 0 ? 'active' : ''}" 
                                         onclick="changeMainImage('${imgUrl}', this)">
                                `).join('')}
                            </div>
                        ` : ''}
                        <div class="main-image-container">
                            <img src="${images[0]}" alt="${product.name}" id="main-product-img">
                        </div>
                    </div>
                    
                    <div class="product-info-panel">
                        ${product.badge ? `<span class="badge-tag-detail ${product.badge.toLowerCase()}">${product.badge}</span>` : ''}
                        
                        ${product.brand ? `<div class="product-brand">${product.brand}</div>` : ''}
                        <h1 class="product-title">${product.name}</h1>
                        
                        <div class="product-price-row">
                            <span class="product-price-current">R$ ${product.price.toFixed(2).replace('.', ',')}</span>
                            ${product.old ? `<span class="product-price-old">R$ ${product.old.toFixed(2).replace('.', ',')}</span>` : ''}
                        </div>
                        
                        <p class="product-description">${product.description}</p>
                        
                        ${product.colors && product.colors.length > 0 ? `
                            <div class="option-section">
                                <div class="option-title">Cor: <span id="selected-color-name" style="text-transform:none; font-weight:normal; color:var(--gray);"></span></div>
                                <div class="color-selector">
                                    ${product.colors.map(col => `
                                        <div class="color-option ${col === selectedColor ? 'selected' : ''}" 
                                             style="background-color: ${col};" 
                                             onclick="selectColor('${col}')"
                                             title="${col}"></div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                        
                        ${product.sizes && product.sizes.length > 0 ? `
                            <div class="option-section">
                                <div class="option-title">Tamanho: <span id="selected-size-name" style="text-transform:none; font-weight:normal; color:var(--gray);"></span></div>
                                <div class="size-selector">
                                    ${product.sizes.map(sz => `
                                        <button class="size-option ${sz === selectedSize ? 'selected' : ''}" 
                                                onclick="selectSize('${sz}')">${sz}</button>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="option-section">
                            <div class="option-title">Quantidade: <span id="selected-qty-name" style="text-transform:none; font-weight:normal; color:var(--gray);"></span></div>
                            <div class="purchase-controls" style="margin-top: 10px; border-top: none; padding-top: 0;">
                                <div class="quantity-selector">
                                    <button class="quantity-btn" onclick="updateQty(-1)">-</button>
                                    <div class="quantity-value" id="qty-val">${quantity}</div>
                                    <button class="quantity-btn" onclick="updateQty(1)">+</button>
                                </div>
                                
                                <button class="btn-primary btn-purchase" onclick="buyProduct()">
                                    Adicionar ao Carrinho
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            updateAllThreatLabels();
        }

        function changeMainImage(url, thumbElement) {
            const mainImg = document.getElementById('main-product-img');
            if (!mainImg) return;
            
            mainImg.style.opacity = '0.3';
            setTimeout(() => {
                mainImg.src = url;
                mainImg.style.opacity = '1';
            }, 150);

            const thumbnails = document.querySelectorAll('.thumbnail-item');
            thumbnails.forEach(t => t.classList.remove('active'));
            if (thumbElement) {
                thumbElement.classList.add('active');
            }
        }

        function selectColor(color) {
            selectedColor = color;
            const options = document.querySelectorAll('.color-option');
            options.forEach(opt => {
                if (opt.getAttribute('title') === color) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
            updateAllThreatLabels();
            if (typeof window.updateAppState === 'function') {
                window.updateAppState(selectedColor, selectedSize, quantity);
            }
        }

        function updateColorNameLabel() {
            const label = document.getElementById('selected-color-name');
            if (label) {
                if (window.showThreatLevels && typeof window.mapColorToDanger === 'function') {
                    label.textContent = window.mapColorToDanger(selectedColor);
                } else if (product && product.colors && product.colorsName) {
                    const idx = product.colors.indexOf(selectedColor);
                    if (idx !== -1 && product.colorsName[idx]) {
                        label.textContent = product.colorsName[idx];
                    } else {
                        label.textContent = selectedColor;
                    }
                } else {
                    const names = {
                        '#f5c4b3': 'Pêssego Suave',
                        '#aaf0cb': 'Verde Menta',
                        '#b5d4f4': 'Azul Céu',
                        '#fff': 'Branco Clássico',
                        '#2c2c2a': 'Preto Editorial',
                        '#c4705a': 'Rosa Classic',
                        '#6080a0': 'Azul Denim',
                        '#f5e6e0': 'Areia Natural',
                        '#f5ece8': 'Off-White Nobre',
                        '#80a080': 'Verde Oliva',
                        '#888': 'Cinza Urbano'
                    };
                    label.textContent = names[selectedColor] || selectedColor;
                }
            }
        }

        function updateSizeNameLabel() {
            const label = document.getElementById('selected-size-name');
            if (label) {
                if (window.showThreatLevels && typeof window.mapSizeToViolence === 'function') {
                    label.textContent = window.mapSizeToViolence(selectedSize);
                } else {
                    label.textContent = selectedSize;
                }
            }
        }

        function updateQtyNameLabel() {
            const label = document.getElementById('selected-qty-name');
            if (label) {
                if (window.showThreatLevels && typeof window.mapQuantityToPeople === 'function') {
                    label.textContent = window.mapQuantityToPeople(quantity);
                } else {
                    label.textContent = quantity;
                }
            }
        }

        function updateAllThreatLabels() {
            updateColorNameLabel();
            updateSizeNameLabel();
            updateQtyNameLabel();
        }
        window.updateAllThreatLabels = updateAllThreatLabels;

        function selectSize(size) {
            selectedSize = size;
            const options = document.querySelectorAll('.size-option');
            options.forEach(opt => {
                if (opt.textContent === size) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
            updateAllThreatLabels();
            if (typeof window.updateAppState === 'function') {
                window.updateAppState(selectedColor, selectedSize, quantity);
            }
        }

        function updateQty(val) {
            quantity += val;
            if (quantity < 1) quantity = 1;
            const qtyVal = document.getElementById('qty-val');
            if (qtyVal) qtyVal.textContent = quantity;
            updateAllThreatLabels();
            if (typeof window.updateAppState === 'function') {
                window.updateAppState(selectedColor, selectedSize, quantity);
            }
        }

        function buyProduct() {
            if (!product) return;
            addToCart(product.id, selectedColor, selectedSize, quantity);
            openCart();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProductDetail();
        });
    </script>
</body>
</html>
